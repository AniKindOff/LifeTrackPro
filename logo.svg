<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect x="10" y="10" width="180" height="180" rx="24" ry="24" fill="url(#gradient)" />
  
  <!-- Checkmark -->
  <path d="M60,110 L85,135 L140,80" stroke="white" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Clock Circle -->
  <circle cx="120" cy="80" r="40" stroke="white" stroke-width="8" fill="none" />
  
  <!-- Clock Hands -->
  <line x1="120" y1="80" x2="120" y2="50" stroke="white" stroke-width="6" stroke-linecap="round" transform="rotate(-30, 120, 80)" />
  <line x1="120" y1="80" x2="120" y2="60" stroke="white" stroke-width="6" stroke-linecap="round" transform="rotate(60, 120, 80)" />
</svg> 