<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Riya AI Assistant - LifeTrackPro (Direct Mode)</title>
  <style>
    /* Base styles */
    :root {
      --primary: #10a37f;
      --secondary: #0ea5e9;
      --accent: #8b5cf6;
      --background: #ffffff;
      --foreground: #202123;
      --muted: #6b7280;
      --card: #ffffff;
      --border: #e5e7eb;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }
    
    body.dark-mode {
      --primary: #20c997;
      --secondary: #38bdf8;
      --accent: #a78bfa;
      --background: #111827;
      --foreground: #f9fafb;
      --muted: #9ca3af;
      --card: #1f2937;
      --border: #374151;
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--background);
      color: var(--foreground);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    
    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px;
      background-color: var(--card);
      border-bottom: 1px solid var(--border);
      box-shadow: var(--shadow);
    }
    
    .header-logo {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .header-logo img {
      width: 32px;
      height: 32px;
    }
    
    .header-actions {
      display: flex;
      gap: 12px;
    }
    
    button {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background-color: transparent;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--foreground);
      cursor: pointer;
      transition: all 0.2s;
      font-size: 14px;
    }
    
    button:hover {
      background-color: var(--border);
    }
    
    .settings-button {
      display: flex;
      align-items: center;
    }
    
    .theme-toggle {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--foreground);
    }
    
    /* Chat container */
    .chat-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding: 16px;
    }
    
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      gap: 16px;
      display: flex;
      flex-direction: column;
    }
    
    .message {
      max-width: 85%;
      padding: 12px 16px;
      border-radius: 16px;
      line-height: 1.5;
      position: relative;
      word-break: break-word;
    }
    
    .message.bot {
      align-self: flex-start;
      background-color: var(--card);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }
    
    .message.user {
      align-self: flex-end;
      background-color: var(--primary);
      color: white;
      border-bottom-right-radius: 4px;
    }
    
    .input-area {
      margin-top: 16px;
      display: flex;
      gap: 8px;
      padding: 16px;
      background-color: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    
    .voice-button,
    .send-button {
      background-color: var(--primary);
      color: white;
      width: 40px;
      height: 40px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
    }
    
    input[type="text"] {
      flex: 1;
      padding: 8px 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 16px;
      background-color: var(--background);
      color: var(--foreground);
    }
    
    input[type="text"]:focus {
      outline: none;
      border-color: var(--primary);
    }
    
    /* Typing indicator */
    .typing-indicator {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 12px 16px;
      width: fit-content;
      background-color: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      border-bottom-left-radius: 4px;
      margin-top: 8px;
    }
    
    .typing-dot {
      width: 8px;
      height: 8px;
      background-color: var(--muted);
      border-radius: 50%;
      animation: typing 1.5s infinite;
    }
    
    .typing-dot:nth-child(2) {
      animation-delay: 0.2s;
    }
    
    .typing-dot:nth-child(3) {
      animation-delay: 0.4s;
    }
    
    @keyframes typing {
      0% { transform: translateY(0); }
      25% { transform: translateY(-5px); }
      50% { transform: translateY(0); }
    }
    
    /* Toast */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background-color: var(--foreground);
      color: white;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 14px;
      opacity: 0;
      transition: opacity 0.3s;
      z-index: 100;
    }
    
    .toast.show {
      opacity: 1;
    }
    
    .toast.success {
      background-color: #10b981;
    }
    
    .toast.error {
      background-color: #ef4444;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-logo">
      <div style="width: 32px; height: 32px; background: #10a37f; color: white; display: flex; align-items: center; justify-content: center; border-radius: 8px; font-weight: bold;">R</div>
      <h1>Riya AI Assistant</h1>
    </div>
    <div class="header-actions">
      <button class="settings-button" id="settingsButton">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
        <span>Settings</span>
      </button>
      <button class="theme-toggle" id="themeToggle">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>
    </div>
  </div>
  
  <div class="chat-container">
    <div class="messages" id="messages">
      <div class="message bot">
        Hello! I'm Riya, your AI assistant. I'm running in direct mode without an API connection, so my capabilities are limited. How can I assist you today?
      </div>
    </div>
    
    <div class="input-area">
      <button class="voice-button" id="voiceButton">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
          <line x1="12" y1="19" x2="12" y2="23"></line>
          <line x1="8" y1="23" x2="16" y2="23"></line>
        </svg>
      </button>
      <input type="text" id="messageInput" placeholder="Type your message..." autocomplete="off">
      <button class="send-button" id="sendButton">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>
  </div>
  
  <!-- Toast notification -->
  <div class="toast" id="toast"></div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // DOM Elements
      const messagesContainer = document.getElementById('messages');
      const messageInput = document.getElementById('messageInput');
      const sendButton = document.getElementById('sendButton');
      const voiceButton = document.getElementById('voiceButton');
      const themeToggle = document.getElementById('themeToggle');
      const toast = document.getElementById('toast');
      
      // State
      let isListening = false;
      let speechRecognition = null;
      let isDarkMode = localStorage.getItem('darkMode') === 'true';
      
      // Initialize dark mode
      if (isDarkMode) {
        document.body.classList.add('dark-mode');
      }
      
      // Toggle dark mode
      themeToggle.addEventListener('click', function() {
        isDarkMode = !isDarkMode;
        document.body.classList.toggle('dark-mode', isDarkMode);
        localStorage.setItem('darkMode', isDarkMode);
        
        showToast(isDarkMode ? 'Dark mode enabled' : 'Light mode enabled');
      });
      
      // Show toast notification
      function showToast(message, type = '') {
        toast.textContent = message;
        toast.className = 'toast';
        if (type) toast.classList.add(type);
        toast.classList.add('show');
        
        setTimeout(() => {
          toast.classList.remove('show');
        }, 3000);
      }
      
      // Show typing indicator
      function showTypingIndicator() {
        const typingIndicator = document.createElement('div');
        typingIndicator.className = 'typing-indicator';
        typingIndicator.id = 'typingIndicator';
        
        for (let i = 0; i < 3; i++) {
          const dot = document.createElement('div');
          dot.className = 'typing-dot';
          typingIndicator.appendChild(dot);
        }
        
        messagesContainer.appendChild(typingIndicator);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
      }
      
      // Remove typing indicator
      function removeTypingIndicator() {
        const typingIndicator = document.getElementById('typingIndicator');
        if (typingIndicator) {
          typingIndicator.remove();
        }
      }
      
      // Add a message to the chat
      function addMessage(text, isUser = false) {
        const messageElement = document.createElement('div');
        messageElement.className = `message ${isUser ? 'user' : 'bot'}`;
        messageElement.textContent = text;
        
        messagesContainer.appendChild(messageElement);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
      }
      
      // Direct response generator (no API)
      function generateDirectResponse(message) {
        const lowerMessage = message.toLowerCase();
        
        if (lowerMessage.includes('hello') || lowerMessage.includes('hi')) {
          return "Hello! How can I help you today?";
        }
        else if (lowerMessage.includes('help')) {
          return "I can help with task management, productivity tips, and habit tracking. What specifically do you need assistance with?";
        }
        else if (lowerMessage.includes('task') || lowerMessage.includes('todo')) {
          return "I can help you manage tasks. In this direct mode, I can't save tasks to a database, but I can provide suggestions for task management.";
        }
        else if (lowerMessage.includes('habit') || lowerMessage.includes('routine')) {
          return "Developing good habits is important for productivity. Try to stick to consistent times for your important daily activities.";
        }
        else if (lowerMessage.includes('time') || lowerMessage.includes('management')) {
          return "Time management is essential. I recommend techniques like the Pomodoro method - 25 minutes of focus followed by a 5-minute break.";
        }
        else if (lowerMessage.includes('focus') || lowerMessage.includes('concentrate')) {
          return "To improve focus, minimize distractions, use the Pomodoro technique, and ensure you're getting enough sleep and exercise.";
        }
        else if (lowerMessage.includes('procrastination')) {
          return "To overcome procrastination, break tasks into smaller steps, use the 2-minute rule for quick tasks, and create accountability systems.";
        }
        else if (lowerMessage.includes('reminder') || lowerMessage.includes('remind')) {
          return "I'd be happy to remind you, but in direct mode I can't set persistent reminders. When using the full app, I can help with that feature.";
        }
        else if (lowerMessage.includes('thank')) {
          return "You're welcome! I'm glad I could help.";
        }
        else {
          return `I understand you're asking about "${message}". In direct mode, I have limited responses. Would you like to know about tasks, habits, or productivity tips?`;
        }
      }
      
      // Send message
      function sendMessage() {
        const message = messageInput.value.trim();
        if (!message) return;
        
        // Add user message
        addMessage(message, true);
        messageInput.value = '';
        
        // Show typing indicator
        showTypingIndicator();
        
        // Simulate processing delay (more natural)
        setTimeout(() => {
          // Remove typing indicator
          removeTypingIndicator();
          
          // Generate response
          const response = generateDirectResponse(message);
          
          // Add bot response
          addMessage(response);
        }, 1000);
      }
      
      // Initialize speech recognition
      function initSpeechRecognition() {
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
          const SpeechRecognition = window.webkitSpeechRecognition || window.SpeechRecognition;
          speechRecognition = new SpeechRecognition();
          
          speechRecognition.continuous = false;
          speechRecognition.interimResults = false;
          speechRecognition.lang = 'en-US';
          
          speechRecognition.onstart = function() {
            isListening = true;
            voiceButton.style.backgroundColor = '#ef4444';
            showToast('Listening...');
          };
          
          speechRecognition.onend = function() {
            isListening = false;
            voiceButton.style.backgroundColor = '';
          };
          
          speechRecognition.onresult = function(event) {
            const transcript = event.results[0][0].transcript;
            messageInput.value = transcript;
            setTimeout(() => sendMessage(), 500);
          };
          
          speechRecognition.onerror = function(event) {
            console.error('Speech recognition error:', event.error);
            isListening = false;
            voiceButton.style.backgroundColor = '';
            showToast('Speech recognition error', 'error');
          };
        } else {
          voiceButton.style.display = 'none';
          console.log('Speech recognition not supported in this browser');
        }
      }
      
      initSpeechRecognition();
      
      // Toggle speech recognition
      function toggleSpeechRecognition() {
        if (!speechRecognition) return;
        
        if (isListening) {
          speechRecognition.stop();
        } else {
          speechRecognition.start();
        }
      }
      
      // Event listeners
      sendButton.addEventListener('click', sendMessage);
      
      messageInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault(); // Prevent default to avoid newline
          sendMessage();
        }
      });
      
      voiceButton.addEventListener('click', toggleSpeechRecognition);
      
      // Focus on input when page loads
      messageInput.focus();
    });
  </script>
</body>
</html>
